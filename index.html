<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta
      name="description"
      content="Aloha Security Agency — Recruitment and Deployment Management System. Apply for security guard, lady guard, VIP escort, CCTV operator and driver positions."
    />
    <meta name="theme-color" content="#111111" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Content Security Policy.
      `connect-src` must include your Supabase project origin; the wildcard below
      covers *.supabase.co REST/Auth/Storage plus the Realtime websocket.
      Prefer serving this as a response header at the CDN/host layer in production.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               frame-ancestors 'none';
               form-action 'self';
               img-src 'self' data: blob: https://*.supabase.co;
               font-src 'self' data:;
               style-src 'self' 'unsafe-inline';
               script-src 'self';
               connect-src 'self' https://*.supabase.co wss://*.supabase.co;"
    />
    <title>Aloha Security Agency — Recruitment &amp; Deployment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
