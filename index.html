<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta
      name="description"
      content="Aloha Security Agency Recruitment and Deployment Management System. Apply for security guard, lady guard, VIP escort, CCTV operator and driver positions."
    />

    <!-- Brand Colors for Mobile Browsers -->
    <meta name="theme-color" content="#e23828" />
    <meta name="apple-mobile-web-app-title" content="Aloha Security" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <meta name="color-scheme" content="light dark" />

    <!--
      Content Security Policy.
      `connect-src` must include your Supabase project origin; the wildcard below
      covers *.supabase.co REST/Auth/Storage plus the Realtime websocket.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               frame-ancestors 'none';
               form-action 'self';
               img-src 'self' data: blob: https://*.supabase.co;
               font-src 'self' data:;
               style-src 'self' 'unsafe-inline';
               script-src 'self';
               connect-src 'self' https://*.supabase.co wss://*.supabase.co;"
    />

    <title>Aloha Security Agency Recruitment &amp; Deployment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
